[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "han-docx-lint"
version = "0.3.0"
description = "A dependency-free linter for common quality issues in Chinese academic DOCX files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "heavenoracle" }]
keywords = ["docx", "lint", "chinese", "academic-writing", "ooxml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup",
]

[project.scripts]
han-docx-lint = "han_docx_lint.cli:main"

[project.gui-scripts]
han-docx-lint-gui = "han_docx_lint.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
